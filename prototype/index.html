<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FoS SIS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2301143e'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23e3a51c'%3ESIS%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="proto-banner" role="note">
  <b>PROTOTYPE</b><span>Sample data only. Names, marks and numbers are fictional. Nothing here is saved to a real system.</span>
  <span class="sp"><a href="../docs/architecture/sis-architecture.html" target="_blank" rel="noopener">Architecture documentation</a><button type="button" id="toggle-reqs">Show / hide requirement IDs</button><button type="button" id="toggle-theme">Light / dark</button><button type="button" id="reset-demo">Reset demo data</button></span>
</div>
<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="brand"><img src="assets/img/fos-logo.png" alt="University of Kelaniya, Faculty of Science" width="210" height="47"><b>Student Information System</b><span>Faculty of Science · prototype v0.1</span></div>
    <div id="nav-groups"></div>
  </nav>
  <div>
    <header class="topbar">
      <button class="btn menu" type="button" id="menu-btn" aria-label="Open menu">Menu</button>
      <span class="crumb">Academic year <b>2026/27</b> · Semester I · today <b>12 Nov 2026</b></span>
      <div class="who">
        <label class="rolesel" for="role-select">Viewing as<select id="role-select"></select></label>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="stack" style="gap:0"><b id="who-name" class="small"></b><span id="who-sub" class="tiny muted"></span></span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<button class="btn primary fb-btn" type="button" id="fb-btn" aria-controls="fb-panel">Give feedback</button>
<section class="fb-panel" id="fb-panel" hidden aria-label="Feedback"></section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/data/catalog.js"></script>
<script src="assets/js/data/mock.js"></script>
<script src="assets/js/screens/student.js"></script>
<script src="assets/js/screens/staff.js"></script>
<script src="assets/js/screens/office.js"></script>
<script src="assets/js/screens/insight.js"></script>
<script>App.boot(Mock.seed);</script>
</body>
</html>
